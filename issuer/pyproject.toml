[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "micaissuer"
# Set from the proto release by scripts/update-from-proto.sh (v2.0.0-pre0 is 2.0.0rc0 in Python's version scheme)
version = "2.0.0rc0"
description = "Mica network SDK for issuers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Mica", email = "engineering@mica.io" }]
urls = { Homepage = "https://mica.io/", Source = "https://github.com/1080network/python" }
dependencies = ["micacommon==2.0.0rc0"]

[tool.setuptools.packages.find]
include = ["mica.issuer*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.pyi"]
