[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "micacommon"
# Set from the proto release by scripts/update-from-proto.sh (v2.0.0-pre0 is 2.0.0rc0 in Python's version scheme)
version = "2.0.0rc0"
description = "Shared messages and the mutual TLS channel helper for the Mica network SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Mica", email = "engineering@mica.io" }]
urls = { Homepage = "https://mica.io/", Source = "https://github.com/1080network/python" }
dependencies = ["protobuf>=6.32.1", "grpcio>=1.74.0"]

[tool.setuptools.packages.find]
include = ["mica.common*", "mica.member*", "micashared*", "mica.sdk*", "validate*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.pyi"]
